<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PyTrainer</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#131218" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f5f1" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PyTrainer">
<link rel="stylesheet" href="vendor/cm-codemirror.min.css">
<link rel="stylesheet" href="style.css">
<script>try{const t=localStorage.getItem("pt-theme");if(t)document.documentElement.dataset.theme=t;const z=localStorage.getItem("pt-code-size");if(z)document.documentElement.style.setProperty("--code-size",z+"px")}catch(e){}</script>
</head>
<body>
<div class="shell">
  <nav class="rail" id="rail">
    <a class="brand" href="#/home"><img src="icon.svg" width="26" height="26" alt=""><span>PyTrainer</span></a>
    <div class="nav">
      <a href="#/home" data-nav="home">Home</a>
      <a href="#/course" data-nav="course">Course</a>
      <a href="#/reviews" data-nav="reviews">Reviews <span class="badge hidden" id="review-badge"></span></a>
      <a href="#/library" data-nav="library">Library <span class="count" id="lib-count"></span></a>
      <a href="#/projects" data-nav="projects">Projects</a>
      <a href="#/labs" data-nav="labs">Ship it labs</a>
      <a href="#/progress" data-nav="progress">Progress</a>
    </div>
    <div class="rail-course" id="rail-course"></div>
    <div class="spacer"></div>
    <a class="rail-xp" id="rail-xp" href="#/progress" hidden></a>
    <div class="nav"><a href="#/settings" data-nav="settings">Settings</a></div>
    <div class="ai-status" id="ai-status"></div>
  </nav>
  <main class="main" id="main"></main>
</div>
<script src="vendor/cm-codemirror.min.js"></script>
<script src="vendor/cm-python.min.js"></script>
<script src="vendor/cm-matchbrackets.min.js"></script>
<script src="vendor/cm-closebrackets.min.js"></script>
<script src="vendor/cm-comment.min.js"></script>
<script src="vendor/cm-active-line.min.js"></script>
<script src="vendor/cm-placeholder.min.js"></script>
<script src="vendor/cm-runmode.min.js"></script>
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
